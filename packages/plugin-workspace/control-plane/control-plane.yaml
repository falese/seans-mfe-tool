# The tools composition (ADR-107, ADR-116 §7). decompose:workspace runs the workspace MFE
# standalone; this is what lets a shell compose it too, one view per state.
project: smt-tools
namespace: smt-tools
mfes:
  - decomposition-workspace
routes:
  - when: smt-tools.decomposition.map
    place:
      - capability: ProposalMap
        into: root
  - when: smt-tools.decomposition.shape
    place:
      - capability: ShapeProposal
        into: root
  - when: smt-tools.decomposition.agent
    place:
      - capability: AgentPane
        into: root
  - when: smt-tools.decomposition.approve
    place:
      - capability: ApproveProposal
        into: root
