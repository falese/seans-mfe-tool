project: abc-kids
namespace: abc
mfes:
  - abc-kids-flappy
  - abc-kids-hockey
  - abc-kids-multiplication-quiz
  - abc-kids-counting-stars
  - abc-kids-letter-pop
  - abc-kids-shape-sorter
  - abc-kids-color-mixer
  - abc-kids-animal-sounds
  - abc-kids-memory-match
  - abc-kids-rocket-math
  - abc-kids-word-builder
  - abc-kids-rhythm-tap
  - abc-kids-maze-runner
  - abc-kids-home
routes:
  - when: abc.play.{game}
    forEach:
      game:
        - flappy
        - hockey
        - multiplication-quiz
        - counting-stars
        - letter-pop
        - shape-sorter
        - color-mixer
        - animal-sounds
        - memory-match
        - rocket-math
        - word-builder
        - rhythm-tap
        - maze-runner
    place:
      - from: abc-kids-{game}
        capability: PlayGame
        into: abc-kids-home/main
  - when: abc.show.{game}
    forEach:
      game:
        - flappy
        - hockey
        - multiplication-quiz
        - counting-stars
        - letter-pop
        - shape-sorter
        - color-mixer
        - animal-sounds
        - memory-match
        - rocket-math
        - word-builder
        - rhythm-tap
        - maze-runner
    place:
      - from: abc-kids-{game}
        capability: ShowCover
        into: abc-kids-home/info
  - when: abc.info.{game}
    forEach:
      game:
        - flappy
        - hockey
        - multiplication-quiz
        - counting-stars
        - letter-pop
        - shape-sorter
        - color-mixer
        - animal-sounds
        - memory-match
        - rocket-math
        - word-builder
        - rhythm-tap
        - maze-runner
    place:
      - from: abc-kids-{game}
        capability: GetGameInfo
        into: abc-kids-home/info
  - when: abc.root
    place:
      - capability: GameMenu
        into: root
        props:
          games:
            - id: flappy
              title: Flappy
              emoji: 🐤
              color: '#0277bd'
            - id: hockey
              title: Hockey
              emoji: 🏒
              color: '#37474f'
            - id: multiplication-quiz
              title: Multiplication Quiz
              emoji: ✖️
              color: '#6a1b9a'
            - id: counting-stars
              title: Counting Stars
              emoji: ⭐
              color: '#1a237e'
            - id: letter-pop
              title: Letter Pop
              emoji: 🎈
              color: '#b71c1c'
            - id: shape-sorter
              title: Shape Sorter
              emoji: 🔷
              color: '#004d40'
            - id: color-mixer
              title: Color Mixer
              emoji: 🎨
              color: '#4a148c'
            - id: animal-sounds
              title: Animal Sounds
              emoji: 🐮
              color: '#33691e'
            - id: memory-match
              title: Memory Match
              emoji: 🃏
              color: '#880e4f'
            - id: rocket-math
              title: Rocket Math
              emoji: 🚀
              color: '#0d47a1'
            - id: word-builder
              title: Word Builder
              emoji: 🔤
              color: '#e65100'
            - id: rhythm-tap
              title: Rhythm Tap
              emoji: 🥁
              color: '#263238'
            - id: maze-runner
              title: Maze Runner
              emoji: 🌀
              color: '#1b5e20'
