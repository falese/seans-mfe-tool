# Composition smoke (#345): does a generated MFE still compose?
#
# Every other job is static — bytes, types, manifests, declared-vs-used — and
# the root Playwright suite runs against a hand-written fixture, not an MFE.
# This one builds the abc-kids base fleet (control plane, API, three generated
# MFEs, shell), starts it, and drives it in Chromium: federation resolves,
# remotes mount, a render throw is contained.
#
# Advisory for now: not a required check. It is the slowest job in the repo
# and has no history yet, so it earns "required" after a week of runs.
#
# Path-filtered to what can change the composed result.
name: Composition

on:
  pull_request:
    paths:
      - 'packages/codegen/templates/**'
      - 'packages/plugin-bff/templates/**'
      - 'packages/runtime/src/**'
      - 'packages/contracts/src/**'
      - 'packages/framework-react/**'
      - 'packages/framework-angular/**'
      - 'packages/control-plane/**'
      - 'examples/abc-kids/**'
      - 'Dockerfile.cli'
      - '.github/workflows/composition.yml'
  push:
    branches: [main]
    paths:
      - 'packages/codegen/templates/**'
      - 'packages/plugin-bff/templates/**'
      - 'packages/runtime/src/**'
      - 'packages/contracts/src/**'
      - 'packages/framework-react/**'
      - 'packages/framework-angular/**'
      - 'packages/control-plane/**'
      - 'examples/abc-kids/**'
      - 'Dockerfile.cli'
      - '.github/workflows/composition.yml'
  workflow_dispatch:

concurrency:
  group: composition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abc-kids:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_FILE: examples/abc-kids/docker-compose.yaml
      # Classic sequential builds. BuildKit's bake runs every service at once,
      # and a parallel fleet build exhausts memory and surfaces as an unrelated
      # `npm install` exit 1 in whichever service loses.
      COMPOSE_BAKE: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # dist/runtime is baked into the CLI image, and every MFE image stages
      # the runtime from it — so the CLI image is built from this commit.
      - name: Build the CLI and its image
        run: |
          npm run build
          npm run docker:build:cli

      - name: Build the base fleet, one service at a time
        run: |
          for svc in registry daemon abc-kids-api abc-kids-flappy abc-kids-hockey abc-kids-multiplication-quiz abc-kids-shell; do
            echo "::group::build $svc"
            docker compose build "$svc"
            echo "::endgroup::"
          done

      # Not `up --wait`: the seans-mfe-tool-cli service is an image holder with
      # no command, so it exits at once and --wait reports that as a failure.
      # Poll the endpoints the suite actually uses instead.
      - name: Start the fleet and wait for it
        run: |
          docker compose up -d
          wait_for() {
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null "$1"; then echo "ready: $1"; return 0; fi
              sleep 5
            done
            echo "::error::not ready after 5 minutes: $1"; return 1
          }
          wait_for http://localhost:4000/
          wait_for http://localhost:3101/health
          wait_for http://localhost:3001/remoteEntry.js
          wait_for http://localhost:3002/remoteEntry.js
          wait_for http://localhost:3003/remoteEntry.js
          wait_for http://localhost:3000/

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Drive the composed fleet
        run: npx playwright test -c examples/abc-kids/playwright.config.ts --reporter=list,html
        env:
          CI: true
          PLAYWRIGHT_HTML_REPORT: composition-report

      - name: Collect container state and logs
        if: failure()
        run: |
          docker compose ps -a > compose-ps.txt
          docker compose logs --no-color --timestamps > compose-logs.txt

      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: composition-failure
          path: |
            composition-report/
            compose-ps.txt
            compose-logs.txt
          retention-days: 7

      - name: Stop the fleet
        if: always()
        run: docker compose down -v --remove-orphans
