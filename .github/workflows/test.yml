name: Tests

on:
  push:
    branches: [main, develop]
  # The `branches:` filter on a pull_request event matches the **base**, not the
  # head. Stacked PRs never target main — each is based on the branch below it —
  # so `[main, develop]` silently skipped every job in this file for them. Not
  # "pending", not "failed": zero check runs.
  #
  # Measured on a four-deep stack: the bottom PR had 16 check runs, the top two
  # had none, and the only gate covering them was api-docs.yml, which has no
  # base filter. A React import leaked into the runtime barrel and shipped
  # through that blind spot — found by a human running `docker compose build`,
  # not by CI.
  #
  # `claude/**` rather than dropping the filter: it covers the branch naming
  # CLAUDE.md mandates without opening the suite to every fork branch.
  #
  # Note for whoever merges a stack: retargeting does NOT re-trigger this
  # workflow. `pull_request` defaults to opened/synchronize/reopened, and a base
  # change fires `edited`. After the PR below merges, push or re-run manually to
  # get CI on the new base.
  pull_request:
    branches: [main, develop, 'claude/**']

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 18 is EOL; test on supported LTS lines.
        node-version: [20.x, 22.x]

    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Full build, not a subset. This step used to compile only
      # packages/contracts and packages/oclif-base, leaving `dist/`, the oclif
      # manifest, and five workspace packages absent — so `node bin/run.js`
      # resolved ZERO commands ("command adr:status not found") or crashed in
      # findCommand with MODULE_NOT_FOUND. Verified by reproducing that exact
      # build state locally: even `schemas --json` returns 0 bytes.
      #
      # The workaround had been to exclude the tests that noticed:
      # json-contract.test.ts and remote-mfe.integration.test.ts were in
      # --testPathIgnorePatterns below. Both pass against a built CLI, so the
      # exclusions are gone and the build is real.
      #
      # This is what the local-test runbook tells a human to run, so it is what
      # CI should run.
      - name: Build the CLI
        run: npm run build

      - name: Run all tests with coverage
        run: |
          set +e
          npm test -- --ci --coverage \
            --testPathIgnorePatterns="/examples/" \
            --testPathIgnorePatterns="NodemonServer.test.js" \
            --testPathIgnorePatterns="create-shell.test.js" \
            --json --outputFile=/tmp/jest-results.json
          JEST_EXIT=$?
          exit $JEST_EXIT
        env:
          CI: true

      - name: Post test results as PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const { execSync } = require('child_process');
          try {
            const r = JSON.parse(fs.readFileSync('/tmp/jest-results.json', 'utf8'));
            const node = '${{ matrix.node-version }}';
            // jest 29 JSON reporter uses `name` for file path and `assertionResults` for tests
            const failed = r.testResults.filter(t => t.status === 'failed');
            let body = `## CI Test Results — Node ${node}\n\n`;
            body += `**Suites**: ${r.numPassedTestSuites} passed, ${r.numFailedTestSuites} failed\n`;
            body += `**Tests**: ${r.numPassedTests} passed, ${r.numFailedTests} failed\n\n`;
            if (failed.length > 0) {
              body += `### Failed suites\n\n`;
              failed.slice(0, 10).forEach(t => {
                const filePath = t.name || t.testFilePath || 'unknown';
                const rel = filePath.replace(process.cwd() + '/', '');
                body += `**${rel}**\n\n`;
                if (t.message) {
                  const lines = t.message.split('\n').filter(l => l.trim()).slice(0, 8);
                  body += `\`\`\`\n${lines.join('\n')}\n\`\`\`\n\n`;
                }
                const assertions = t.assertionResults || t.testResults || [];
                assertions.filter(tr => tr.status === 'failed').slice(0, 5).forEach(tr => {
                  body += `- \`${tr.fullName || tr.title || '(unnamed)'}\`\n`;
                  if (tr.failureMessages && tr.failureMessages[0]) {
                    const line = tr.failureMessages[0].split('\n').find(l => l.trim()) || '';
                    body += `  > ${line.trim()}\n`;
                  }
                });
                body += '\n';
              });
            } else {
              body += `All test suites passed. Exit may be from coverage threshold.\n`;
            }
            fs.writeFileSync('/tmp/pr-comment.md', body);
          } catch (e) {
            fs.writeFileSync('/tmp/pr-comment.md', `Script error: ${e.message}\n${e.stack}`);
          }
          SCRIPT
          PR_NUM="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          gh pr comment "$PR_NUM" --body-file /tmp/pr-comment.md --repo "$REPO"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  perf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance suite
        run: npm run test:perf | tee /tmp/perf-output.log
        env:
          CI: true

      - name: Upload perf log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-output
          path: /tmp/perf-output.log
          retention-days: 7

  doc-links:
    # Tier-1 docs link hygiene (cross-reference-standards.md). Refs #231 (R5),
    # #222, #333.
    #
    # Was report-only pending a clean baseline (G15). The baseline is clean —
    # 972 relative links, 0 broken — so this is now a required gate, per the
    # flip condition this job was written with. Eight of the sixteen were paths
    # that moved (`architecture-decisions.md` → the generated `spec.md#adr-index`,
    # `unified-generator.ts` → `packages/codegen/` under ADR-061); the other
    # eight pointed at files that no longer exist and became prose naming the
    # successor.
    #
    # Report-only was the right call while the baseline was dirty and the wrong
    # one afterwards: a warning nobody has to act on is how sixteen accumulated.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Check relative doc links resolve
        run: node scripts/check-doc-links.js

      - name: Check doc path citations resolve
        # check-doc-links covers links BETWEEN documents. This covers the other
        # half: a doc citing `src/dsl/schema.ts` after the monorepo split points
        # the reader at nothing, and nothing noticed for months. Decision records
        # and plans are out of scope — they describe the repo as it was.
        run: node scripts/check-doc-paths.js

  adr-governance:
    # Post a governance summary on every PR: which decisions it changes, which
    # its code rests on, and the register's state (ADR-075).
    #
    # Scoped to the diff on purpose. A 75-row index on every PR is noise nobody
    # reads, and noise nobody reads makes the governance signal look like
    # boilerplate. The comment is sticky — found by its marker and updated in
    # place — so a PR carries one summary, not one per push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v3
        with:
          # The report diffs against the base branch, so it needs the history.
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build:packages

      - name: Render the governance summary
        # `fetch-depth: 0` above already gives full history, so the base ref is
        # present — no extra fetch, and no `|| true` swallowing a real failure.
        #
        # Open issues are fetched here and passed to the script as a file rather
        # than fetched by it (ADR-075 §7): the script stays offline-testable, and
        # the network call lives in the job that already makes one. If the fetch
        # fails the one-way section is simply omitted — it is advisory, and a
        # transient API error must not fail a governance comment.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "${{ github.repository }}" --state open --limit 200 \
            --json number,title,body > /tmp/adr-open-issues.json || echo '[]' > /tmp/adr-open-issues.json
          npx ts-node scripts/adr-governance-report.ts \
            "origin/${{ github.base_ref }}" /tmp/adr-open-issues.json > /tmp/adr-governance.md
          cat /tmp/adr-governance.md

      - name: Post or update the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER='<!-- adr-governance-report -->'
          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUM/comments" --paginate \
            --jq "map(select(.body | contains(\"$MARKER\"))) | .[0].id // empty")
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" \
              -F body=@/tmp/adr-governance.md >/dev/null
            echo "updated comment $EXISTING"
          else
            gh pr comment "$PR_NUM" --body-file /tmp/adr-governance.md --repo "$REPO"
          fi

  quality:
    # Enforce the same gates required before commit (CLAUDE.md): lint,
    # typecheck, full build, and schema drift.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check generated schemas are committed
        run: git diff --exit-code schemas/

      - name: DSL manifest schema is current
        # The published JSON Schema is what editors and registry rule-authoring
        # tooling validate manifests against (ADR-067 §4). It is generated from
        # the zod schema, and without a gate it rots: providesSlots landed
        # 2026-07-11 and was still missing from the artifact months later
        # because this check existed but was never wired in (ADR-073 §6).
        run: npm run build:schema:dsl:check

      - name: Manifest field reference is current
        # Generated from the Zod schema (finding B5). Three hand-written
        # documents described this language and each fell behind it — the one
        # calling itself the complete platform contract did not know the slot
        # contract existed. This page cannot drift without failing here.
        run: npm run build:manifest-reference:check

      - name: MFE drift gate — generator-owned files match their manifests
        # Regenerates every MFE from its mfe-manifest.yaml and fails if any
        # generator-owned file (overwrite:true — the platform-contract shims:
        # remote entry, base-mfe/*, bff/*, server.ts, public/*) has drifted.
        # Generic, platform-wide; developer-owned code is untouched (#295).
        run: npm run check:mfe-drift:check

      - name: Codegen behaviour freeze — generator output matches the baseline
        # The drift gate above compares generated bytes to what is ON DISK, and
        # only for generator-owned files. This compares every file the generator
        # emits — developer-owned included — to a committed baseline across both
        # reference fleets (21 MFEs, 435 files, 42% of them developer-owned and
        # therefore invisible to the drift gate). Verified by planting a change
        # in App.tsx.ejs: drift and consistency both exit 0, this exits 1.
        # A diff here is never noise; regenerate with `npm run build:codegen-snapshot`
        # and review it as part of the change.
        run: npm run build:codegen-snapshot:check

      - name: Published packages can generate an MFE
        # Every other gate runs from a monorepo checkout, where a path resolves
        # whether or not the file would ship. This packs contracts/dsl/codegen/
        # plugin-bff, unpacks them into a scratch node_modules with nothing else
        # in it, and generates a real MFE from only what came out of the
        # tarballs — asserting no module resolved back into the checkout.
        # It is the gate that would have caught plugin-bff shipping zero
        # templates, and codegen reaching outside its own package for them.
        run: npm run check:publish-shape

      - name: Slot placement targets resolve to declared slots
        # Every registry rule's resolve.props.slot must name an address some
        # provider declares (ADR-067 §4, implemented in ADR-073). An unbindable
        # placement does not fail loudly at runtime — ADR-066 parks it and waits
        # — so this is the only place a typo'd or renamed target is caught.
        run: |
          ./bin/run.js slots:validate \
            --rules examples/meridian-station/control-plane/rules.json \
            --manifests examples/meridian-station
          ./bin/run.js slots:validate \
            --rules examples/abc-kids/control-plane/rules.json \
            --manifests examples/abc-kids

      - name: Composition compiles, and the committed payload is not stale
        # control-plane.yaml is the source; rules.json is generated from it
        # (ADR-083). --check fails if the committed payload is not what the
        # document compiles to, which is how a hand-edit to the generated file
        # gets caught. It also re-runs the capability, slot-address and
        # namespace checks the compiler performs.
        run: |
          ./bin/run.js compose:validate examples/meridian-station --check
          ./bin/run.js compose:validate examples/abc-kids --check

      - name: MFE consistency gate — manifest ⇄ package.json ⇄ federation shared
        # Runs the reusable `mfe:validate` core over every examples/** MFE:
        # asserts react/react-dom pins, that manifest deps land in package.json,
        # that every federation `shared` key is a declared dep at the platform
        # version, and that the runtime is declared. Developer-owned config the
        # #295 drift gate never touches (#296).
        run: npm run check:mfe-consistency

      - name: ADR library drift gate
        # The decision record governs every gate above it and was the last
        # artifact kept in sync by hand (ADR-075). Checks frontmatter against the
        # ADR-075 schema, cross-references against what they claim to cite,
        # supersessions for bidirectionality, declared implementation paths for
        # existence, and source citations for pointing at a decision that was
        # actually made.
        #
        # Landed report-only with the gate (#312) and promoted to required here,
        # in the same commit that makes it pass — the doc-links precedent in this
        # file, run to completion rather than left as a permanent warning.
        #
        # `examples/**` is deliberately out of scope: 44 files there carry
        # pre-reflow numbers in generated output that fell out of the generation
        # graph. `npm run check:adr -- --include-examples` reports them.
        run: npm run check:adr

      - name: System map counts match the repository
        # docs/system-map.html is the executive-facing page, and its counts are
        # generated (ADR-075's pattern applied to the page a reader is least
        # able to check for themselves). The gate existed but was wired into no
        # workflow, so the drift it exists to prevent recurred on the very
        # branch that added it: a commit added a test file and left the page
        # claiming the old total, with every required check green. A gate
        # nothing runs is a comment.
        run: npm run build:system-map:check

      - name: ADR index and PDR map are generated from frontmatter
        # The spec.md index and the PDR↔ADR map are views of ADR frontmatter
        # (ADR-075 §1), not second copies of it. Same generate-and-diff idiom as
        # the schema gates above: edit frontmatter, run `npm run build:adr-index`,
        # commit both. Without this the views rot — they disagreed with the files
        # on ADR-057/058 and on qualifiers for six more before ADR-075.
        run: npm run build:adr-index:check

      - name: Meridian regen invariant — generated artifacts match the manifests
        # Re-runs remote:generate across the reference fleet + derives seeds,
        # then fails on any drift (#274 discipline, #276 reference app).
        run: node examples/meridian-station/scripts/generate.mjs --check

      - name: Template typecheck gate — fresh scaffold, real install, real tsc (#281)
        # The other checks above regenerate against committed examples or
        # assert in-memory string content; neither runs a real `npm install`
        # against a freshly generated project. Both regressions that motivated
        # this gate (Angular's tsconfig.app.json.ejs shipping a broken "//"
        # comment key, and React's bootstrap.ts.ejs passing a partial Context)
        # were masked by swc builds and isolated ts-jest — only `tsc --noEmit`
        # against a real, installed, freshly generated project surfaces them.
        run: npm run check:template-typecheck

  swift:
    # Compile the generated Swift package (ADR-096, ADR-098).
    #
    # Until this job, NOTHING compiled the emitted Swift. Every Swift assertion
    # in the suite is a text assertion — the right symbols appear in the right
    # order — which cannot see a type error. Two got through and were caught by
    # reading, not by a gate: `@escaping` inside a typealias (legal only in
    # parameter position) and a checked `Sendable` conformance on a struct
    # holding an existential `Error`.
    #
    # WHAT THIS DOES NOT COVER: the SwiftUI files are behind
    # `#if canImport(SwiftUI)`, which is false on Linux, so the views are
    # SKIPPED rather than compiled. What it does cover is the platform layer —
    # MFEBase, NativeMFEBase, MFELifecycle, Types, the BFF client and provider —
    # which is where essentially all the generated logic lives, and all of what
    # ADR-098 added. The views still need a Mac.
    #
    # It also exercises the SPM build-tool plugin, which regenerates
    # ManifestMetadata.swift from mfe-manifest.json on every build (ADR-095).
    # That half is unreachable from any Node-side gate.
    #
    # Separate job rather than a step in `quality`: it needs a Swift toolchain
    # and no Node, so running it in the official container is both simpler and
    # faster than installing Swift onto the Node runner.
    runs-on: ubuntu-latest
    container: swift:6.0

    steps:
      - uses: actions/checkout@v3

      - name: Swift version
        run: swift --version

      - name: Build and test every generated Swift package
        # --require so a container without a toolchain fails loudly instead of
        # skipping. The script skips by default, which is right for a
        # contributor's machine and wrong here — a silently skipped gate is the
        # failure mode this whole job exists to end.
        run: bash scripts/check-swift-build.sh --require

  rust:
    # Compile, test, lint and format-check the generated Rust crate (ADR-099).
    #
    # The Rust lane's counterpart to the `swift` job, present from its first
    # commit rather than added after type errors got through: every Node-side
    # Rust assertion is a text assertion and cannot see a type error.
    #
    # Unlike `swift` this leaves nothing uncovered — the crate ships no UI, so
    # the whole generated surface compiles here, and `cargo test` RUNS the
    # generated tests/lifecycle.rs: the state machine, the manifest hook engine
    # and both query error policies.
    #
    # Separate job for the same reason as `swift`: it needs a Rust toolchain
    # and no Node.
    runs-on: ubuntu-latest
    container: rust:1

    steps:
      - uses: actions/checkout@v3

      - name: Toolchain components
        run: |
          rustup component add clippy rustfmt
          cargo --version

      - name: Build, test, lint and format-check every generated crate
        # --require so a missing toolchain or component fails loudly instead
        # of skipping — the same reasoning as the swift job.
        run: bash scripts/check-rust-build.sh --require

      - name: MSRV — the rust-version the generated Cargo.toml declares
        # The generated crate claims `rust-version = "1.75"`. That is a promise
        # to every host that builds it, and a dependency release can break it
        # without any change here — so it is checked, not assumed.
        run: |
          rustup toolchain install 1.75 --profile minimal
          find examples -type f -name Cargo.toml -path '*/rust/*' -not -path '*/rust/web/*' -not -path '*/target/*' -print0 |
            while IFS= read -r -d '' manifest; do
              echo "=== $manifest"
              cargo +1.75 test --manifest-path "$manifest"
            done

  rust-wasm:
    # Build the Rust crate for the browser and mount it through the shell's own
    # adaptor in Chromium (ADR-100).
    #
    # ADR-100's claim is that a WebAssembly build needs no shell, runtime or
    # control-plane change — it is one more Module Federation remote. This job
    # is what holds that claim: check-rust-wasm-mount.mjs loads the COMPILED
    # dist/runtime/layout-adaptors.js into the page and mounts every capability
    # through moduleFederationAdaptor, not through a re-implementation of it.
    #
    # Needs Node (dist/runtime, Playwright) and Rust (wasm32, wasm-bindgen), so
    # it runs on the plain runner rather than in the rust container.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (dist/runtime is what the browser probe loads)
        run: npm run build

      - name: Rust toolchain for wasm32
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default stable
          # Must equal the wasm-bindgen version pinned in rust/web/Cargo.toml.
          cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Build, lint and mount every generated WASM remote
        run: bash scripts/check-rust-wasm.sh --require

      - name: MSRV — the rust-version the generated web Cargo.toml declares
        run: |
          rustup toolchain install 1.77 --profile minimal --target wasm32-unknown-unknown
          find examples -type f -name Cargo.toml -path '*/rust/web/*' -not -path '*/target/*' -print0 |
            while IFS= read -r -d '' manifest; do
              echo "=== $manifest"
              cargo +1.77 build --manifest-path "$manifest" --target wasm32-unknown-unknown
            done
